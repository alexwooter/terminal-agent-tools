name: Publish terminalup-odds-mcp to npm

# Token-free releases via npm trusted publishing (OIDC), staged.
# Trusted publisher on npmjs.com (package settings): GitHub Actions,
#   alexwooter / terminal-agent-tools / publish-npm.yml, stage-only.
# Release: bump "version" in mcp/package.json, commit, push a tag like mcp-v0.1.1.
# The workflow stages the version; approve it with 2FA at
# https://www.npmjs.com/settings/w00ter92/staged-packages and it goes live.

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Skip if this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage the release for approval on npmjs.com
        if: steps.check.outputs.exists == 'false'
        run: npm stage publish --access public
